name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Expo prebuild
        run: npx expo prebuild --clean

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties
          cd android && ./gradlew assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk LovelyToon.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lovely-toon-apk
          path: LovelyToon.apk

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: lovely-toon-apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: LovelyToon.apk
          name: "Lovely Toon ${{ github.ref_name }} 💕"
          body: |
            ## What's New
            Download the APK below and install it on your Android phone.
            
            **How to install:**
            1. Download `LovelyToon.apk` from below
            2. Open it on your phone
            3. Allow "Install from unknown sources" if prompted
            4. Pair with your partner and enjoy! 💖
          generate_release_notes: true
          draft: false
          prerelease: false
