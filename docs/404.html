<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lovely Toon — Room Invite</title>
    <meta name="description" content="Someone wants to share their music with you on Lovely Toon!">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #FFF5F7 0%, #FFE0E6 50%, #FFF5F7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 48px 36px;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(255, 75, 114, 0.12);
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FF6B8A 0%, #FFA3B5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 36px;
            color: white;
            font-weight: 800;
        }
        h1 {
            font-size: 26px;
            color: #2D1B2E;
            margin-bottom: 8px;
            font-weight: 800;
        }
        .inviter-name {
            color: #FF6B8A;
        }
        p {
            color: #8B6B8D;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .room-code {
            display: inline-block;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 5px;
            color: #2D1B2E;
            background: #FFF5F7;
            padding: 12px 28px;
            border-radius: 14px;
            margin-bottom: 28px;
            border: 2px solid #FFD4E0;
        }
        .button {
            display: inline-block;
            width: 100%;
            padding: 18px 32px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 17px;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .button:hover {
            transform: translateY(-2px);
        }
        .button-primary {
            background: linear-gradient(135deg, #FF6B8A 0%, #FFA3B5 100%);
            color: white;
            box-shadow: 0 8px 24px rgba(255, 107, 138, 0.35);
            margin-bottom: 12px;
        }
        .button-secondary {
            background: #FFF5F7;
            color: #FF6B8A;
            border: 2px solid #FFD4E0;
        }
        .footer {
            margin-top: 24px;
            font-size: 13px;
            color: #8B6B8D;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar" id="avatar">?</div>
        <h1 id="heading">You've been invited!</h1>
        <p id="description">Someone wants to share their music with you using Lovely Toon.</p>
        
        <div id="code-container" style="display: none;">
            <div class="room-code" id="room-code"></div>
        </div>

        <a id="open-link" href="#" class="button button-primary" style="display: none;">Open in App</a>
        <a href="https://github.com/local-over/LovelyToon/releases/latest" class="button button-secondary">Download Lovely Toon</a>
        
        <div class="footer">Free. No ads. No accounts.</div>
    </div>

    <script>
        const path = window.location.pathname;
        const params = new URLSearchParams(window.location.search);
        const match = path.match(/\/pair\/([a-zA-Z0-9]+)/i);
        
        const inviterName = params.get('name');
        const inviterUid = params.get('uid');
        
        if (match && match[1]) {
            const code = match[1].toUpperCase();
            
            // Show room code
            document.getElementById('room-code').innerText = code;
            document.getElementById('code-container').style.display = 'block';
            
            // Personalize with inviter name
            if (inviterName) {
                const name = decodeURIComponent(inviterName);
                document.getElementById('heading').innerHTML = `<span class="inviter-name">${name}</span> invited you!`;
                document.getElementById('description').innerText = `${name} wants to share what they're listening to with you. Download Lovely Toon and join their room.`;
                document.getElementById('avatar').innerText = name.charAt(0).toUpperCase();
            }
            
            // Build deep link with identity params
            let deepLink = `lovelytoon://pair/${code}`;
            if (inviterUid && inviterName) {
                deepLink += `?uid=${encodeURIComponent(inviterUid)}&name=${encodeURIComponent(inviterName)}`;
            }
            
            // Show "Open in App" button
            const openBtn = document.getElementById('open-link');
            openBtn.href = deepLink;
            openBtn.style.display = 'block';
            
            // Try to auto-open the app after a short delay
            setTimeout(() => {
                window.location.href = deepLink;
            }, 800);
        }
    </script>
</body>
</html>
